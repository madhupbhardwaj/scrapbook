<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrapbook</title>
  <meta name="description" content="Trips, projects and everyday moments, written down with photos and video.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='20' height='22' rx='3' fill='%232B44C4'/%3E%3Crect x='9' y='3' width='19' height='22' rx='3' fill='none' stroke='%232B44C4' stroke-width='2.4'/%3E%3C/svg%3E">
  <script>
    // Set the theme before first paint so there's no flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <button type="button" class="icon-btn menu-btn" aria-controls="sidebar" aria-expanded="false" aria-label="Open sections menu">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/">Scrapbook</a>
    <button type="button" class="icon-btn theme-btn" aria-label="Switch theme"></button>
  </header>

  <div class="shell">
    <nav id="sidebar" class="sidebar" aria-label="Sections"></nav>
    <div class="scrim" hidden></div>
    <main id="main" tabindex="-1">
      <div class="wrap loading" aria-busy="true"><p>Loading…</p></div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
