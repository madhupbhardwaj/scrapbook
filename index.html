<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scrapbook</title>
  <meta name="description" content="Trips, projects and everyday moments, written down with photos and video.">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#F3EBDC">
  <script>
    // Set the theme before first paint so there's no flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Caveat:wght@500;600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <button type="button" class="theme-btn" aria-label="Switch theme"></button>

  <header class="site-head">
    <a class="site-title" href="#/">Scrapbook</a>
    <p class="hand tagline" hidden></p>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections"></nav>

  <div class="shell">
    <aside class="side side-left" id="side-left" aria-label="Calendar and contents"></aside>
    <main id="main" tabindex="-1">
      <p class="hand loading">Loading…</p>
    </main>
    <aside class="side side-right" id="side-right" aria-label="About me"></aside>
  </div>

  <footer class="hand site-foot" id="site-foot"></footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
